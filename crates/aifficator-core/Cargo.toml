[package]
name = "aifficator-core"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
quick-xml = "0.38"
rekordbox-usb = { git = "ssh://git@github.com/rauversion/rekordbox-usb-rs.git", rev = "ddd0ab9ea13117ed4dedcfae97c692e33c0c9743" }
rusqlite = { version = "0.37.0", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
unicode-normalization = "0.1"
url = "2.5"
