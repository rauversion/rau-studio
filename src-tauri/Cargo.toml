[package]
name = "rau-studio"
version = "0.1.35"
description = "Local audio toolkit for DJs and producers"
authors = ["Rauversion"]
edition = "2021"

[lib]
name = "aifficator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aifficator-core = { path = "../crates/aifficator-core" }
argon2 = "0.5.3"
chrono = { version = "0.4.45", features = ["serde"] }
cpal = "0.18.1"
base64 = "0.22.1"
iroh = "1.0.2"
iroh-tickets = "1.0.0"
regex = "1.13.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "query", "rustls"] }
ring = "0.17.14"
rusqlite = { version = "0.37.0", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soulseek-client = { git = "ssh://git@github.com/rauversion/soulseek-rs.git", rev = "20f7f97255e8aa95d79bce029b4e940f62d057a9" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.23.4", features = ["v4", "serde"] }
walkdir = "2.5.0"
zeroize = "1.8.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
core-audio-types-rs = "0.3.5"
core-foundation = "0.10.1"
core-media-rs = "0.3.4"
screencapturekit = "=0.3.6"
