name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":[]}}'
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate private Rust dependencies
        uses: ./.github/actions/private-rust-deps
        with:
          soulseek-key: ${{ secrets.SOULSEEK_DEPLOY_KEY }}
          rekordbox-key: ${{ secrets.REKORDBOX_USB_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal
      - name: Configure Windows OpenSSL build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (!(Test-Path $perl)) {
            choco install strawberryperl --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (!(Test-Path $perl)) { throw 'Strawberry Perl installation is missing' }
          & $perl -MIPC::Cmd -e 'print "Perl build modules available\n"'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libasound2-dev librsvg2-dev
      - name: Check Rust workspace
        shell: bash
        run: cargo +stable check --workspace --all-targets --locked
      - name: Test Rust workspace
        shell: bash
        run: cargo +stable test --workspace --locked --no-fail-fast
      - name: Build frontend
        shell: bash
        run: |
          npm ci
          npm run build
          node --experimental-strip-types --test tests/soulseek-navigation.test.ts
